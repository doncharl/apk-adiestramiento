<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Adiestra — Gestión de clases</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4B6650">
<style>
  :root{
    --bg:#EFE9DC;
    --surface:#FBF8F1;
    --surface-2:#F3EEE0;
    --ink:#23291F;
    --ink-soft:#5B6154;
    --line:#DCD3BE;
    --pine:#4B6650;
    --pine-dark:#374C3D;
    --brass:#AD7C2C;
    --brass-soft:#EFDFBB;
    --brick:#A1462F;
    --brick-soft:#F2DCD4;
    --green-ok:#3F6B49;
    --green-ok-soft:#DCE8DC;
    --violet:#5B4E96;
    --violet-soft:#E4E0F0;
    --radius:14px;
    --radius-sm:8px;
  }
  body.dark{
    --bg:#1C211B;
    --surface:#262C22;
    --surface-2:#2E3527;
    --ink:#ECE7D9;
    --ink-soft:#A7AD9B;
    --line:#3A4133;
    --pine:#6E9772;
    --pine-dark:#9BC49E;
    --brass:#E0B369;
    --brass-soft:#463A20;
    --brick:#E08A70;
    --brick-soft:#4A2A22;
    --green-ok:#8FBF8B;
    --green-ok-soft:#263323;
    --violet:#B3A8E8;
    --violet-soft:#312B4A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    transition:background .15s,color .15s;
  }
  body.fs-sm #app{zoom:0.88;}
  body.fs-md #app{zoom:1;}
  body.fs-lg #app{zoom:1.18;}
  h1,h2,h3{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:600;
    margin:0;
    color:var(--pine-dark);
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:76px;
    position:relative;
  }
  header.topbar{
    padding:18px 18px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
  }
  header.topbar h1{font-size:21px;letter-spacing:.2px;}
  header.topbar .today{font-size:13px;color:var(--ink-soft);}
  main{flex:1;padding:16px 3vw;}
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--surface);
    border-top:1px solid var(--line);
    display:flex;
    z-index:10;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    padding:10px 4px 8px;
    font-size:11.5px;
    color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    cursor:pointer;
    font-family:inherit;
  }
  nav.tabbar button .dot{
    width:6px;height:6px;border-radius:50%;background:transparent;
  }
  nav.tabbar button.active{color:var(--pine-dark);font-weight:600;}
  nav.tabbar button.active .dot{background:var(--brass);}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--pine);color:#fff;border:none;
    padding:10px 16px;border-radius:999px;
    font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  .btn:active{background:var(--pine-dark);}
  .btn.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}
  .btn.danger{background:var(--brick);}
  .btn.ghost{background:none;color:var(--pine-dark);padding:8px 10px;}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn.block{width:100%;}
  .fab{
    position:fixed;
    bottom:88px;
    right:calc(50% - 260px + 18px);
    background:var(--pine);color:#fff;border:none;
    width:52px;height:52px;border-radius:50%;
    padding:0;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;line-height:1;
    box-shadow:0 4px 14px rgba(35,41,31,.28);
    cursor:pointer;
    z-index:8;
  }
  .fab span{transform:translateY(-1px);}
  @media (max-width:559px){.fab{right:18px;}}

  input,select,textarea{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--ink);
  }
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px;font-weight:600;}
  label:first-child{margin-top:0;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .checkboxline{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14.5px;}
  .checkboxline input{width:auto;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .card.tap{cursor:pointer;}
  .card.tap:active{background:var(--surface-2);}
  .card.compact{padding:10px 12px;}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 20px;
    font-size:14px;
  }
  .section-title{
    font-size:12px;
    color:var(--ink-soft);
    margin:18px 0 8px;
    font-weight:600;
  }
  .section-title:first-child{margin-top:0;}
  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:999px;
  }
  .badge.programada{background:var(--brass-soft);color:var(--brass);}
  .badge.completada{background:var(--green-ok-soft);color:var(--green-ok);}
  .badge.cancelada{background:var(--brick-soft);color:var(--brick);}
  .badge.reprogramada{background:var(--violet-soft);color:var(--violet);}
  .badge.individual{background:var(--surface-2);color:var(--ink-soft);}
  .badge.grupal{background:var(--surface-2);color:var(--ink-soft);}
  .badge.cotizando{background:var(--surface-2);color:var(--ink-soft);}
  .badge.enproceso{background:var(--brass-soft);color:var(--brass);}
  .badge.terminado{background:var(--green-ok-soft);color:var(--green-ok);}

  .saldo-pos{color:var(--brick);font-weight:700;}
  .saldo-neg{color:var(--green-ok);font-weight:700;}
  .saldo-zero{color:var(--ink-soft);font-weight:600;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-grid .card{margin-bottom:0;}
  .stat-num{font-family:Georgia,serif;font-size:26px;color:var(--pine-dark);}
  .stat-label{font-size:12px;color:var(--ink-soft);}

  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.42);
    z-index:20;
    display:flex;align-items:flex-end;
    max-width:520px;margin:0 auto;
  }
  .sheet{
    background:var(--bg);
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-head h2{font-size:18px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:4px 8px;}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .chip{
    padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13px;cursor:pointer;color:var(--ink-soft);
  }
  .chip.selected{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--pine-dark);color:var(--bg);padding:9px 18px;border-radius:999px;
    font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .search-wrap{margin-bottom:14px;}
  .attend-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
  .attend-row:last-child{border-bottom:none;}
  .segmented{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-bottom:14px;}
  .segmented button{flex:1;border:none;background:none;padding:7px 0;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink-soft);}
  .segmented button.active{background:var(--surface);color:var(--pine-dark);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav button{background:none;border:none;font-size:20px;color:var(--pine-dark);cursor:pointer;padding:4px 10px;}
  .cal-nav h3{font-size:16px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1.2vw,6px);margin-bottom:16px;width:100%;}
  .cal-weekday-row{display:flex;gap:clamp(2px,1.2vw,6px);margin-bottom:6px;}
  .cal-weekday{flex:1;min-width:0;text-align:center;font-size:clamp(9px,2.6vw,11px);color:var(--ink-soft);padding:2px 0 6px;font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:clamp(34px,11vw,46px);gap:clamp(2px,1.2vw,6px);margin-bottom:16px;}
  .cal-cell{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:clamp(11px,3.2vw,14px);cursor:pointer;background:var(--surface);border:1px solid transparent;gap:2px;}
  .cal-cell.empty{background:none;cursor:default;}
  .cal-cell.today{border-color:var(--brass);}
  .cal-cell.selected{background:var(--pine);color:#fff;}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);}
  .cal-cell.selected .dot{background:#fff;}
  .perro-card{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
  .swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius);margin-bottom:10px;}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;width:84px;display:flex;align-items:center;justify-content:center;background:var(--brick);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  .swipe-content{position:relative;background:var(--surface);transition:transform .18s ease;touch-action:pan-y;}
  .switchish{display:flex;gap:0;}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Adiestra</h1>
    <div class="today" id="todayLabel"></div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab"><span>+</span></button>
  <nav class="tabbar">
    <button data-tab="agenda"><span class="dot"></span>Agenda</button>
    <button data-tab="clientes"><span class="dot"></span>Clientes</button>
    <button data-tab="pagos"><span class="dot"></span>Pagos</button>
    <button data-tab="mas"><span class="dot"></span>Más</button>
  </nav>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Estado y persistencia ---------- */
const STORAGE_KEY = 'adiestra_data_v1';
let state = loadState();
let currentTab = 'agenda';
let agendaMonth = todayISO().slice(0,7);
let agendaSelDay = todayISO();
let clienteSearch = '';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { clientes:[], clases:[], pagos:[], notas:[], recordatorios:[], config:{fontSize:'md',darkMode:false} };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const RAZAS_DEFECTO = [
  'Criollo / Mestizo','Labrador Retriever','Golden Retriever','French Poodle (Caniche)',
  'Schnauzer Miniatura','Bulldog Francés','Bulldog Inglés','Pug','Chihuahua',
  'Yorkshire Terrier','Beagle','Cocker Spaniel','Pastor Alemán','Husky Siberiano',
  'Pitbull','Boxer','Dálmata','Shih Tzu','Maltés','Salchicha (Dachshund)'
];
const HABILIDADES_DEFECTO = [
  'Sentado','Quieto','Llamado','Caminar sin jalar','Acostado','No saltar sobre personas'
];
function migrarDatos(){
  if(!state.config) state.config = {fontSize:'md', darkMode:false};
  if(!state.config.razas) state.config.razas = [...RAZAS_DEFECTO];
  state.clientes.forEach(c=>{
    if(!c.perros){
      c.perros = c.perro ? [{id:uid(), nombre:c.perro, raza:'', fechaNacimiento:'', notas:''}] : [];
    }
    c.perros.forEach(p=>{
      if(p.fechaNacimiento===undefined) p.fechaNacimiento = '';
      if(p.fechaVacuna===undefined) p.fechaVacuna = '';
      if(!p.habilidades) p.habilidades = HABILIDADES_DEFECTO.map(n=>({id:uid(), nombre:n, estado:'por_trabajar'}));
    });
    if(!c.estado) c.estado = (c.activo===false) ? 'terminado' : 'en_proceso';
  });
}

/* ---------- Utilidades ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function fmtMoney(n){
  n = Math.round(n||0);
  return n.toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
}
function clienteNombre(id){
  const c = state.clientes.find(x=>x.id===id);
  return c ? c.nombre : '(cliente eliminado)';
}
function perrosResumen(c){
  return (c.perros&&c.perros.length) ? c.perros.map(p=>p.nombre).join(', ') : '';
}
function calcularEdadTexto(fechaNacIso){
  if(!fechaNacIso) return 'Fecha de nacimiento no registrada';
  const nac = new Date(fechaNacIso+'T00:00:00');
  const hoy = new Date();
  if(nac > hoy) return 'Fecha inválida';
  let años = hoy.getFullYear() - nac.getFullYear();
  let meses = hoy.getMonth() - nac.getMonth();
  if(hoy.getDate() < nac.getDate()) meses--;
  if(meses<0){ años--; meses+=12; }
  if(años===0){
    if(meses===0) return 'Recién nacido';
    return `${meses} mes${meses===1?'':'es'}`;
  }
  if(meses===0) return `${años} año${años===1?'':'s'}`;
  return `${años} año${años===1?'':'s'} y ${meses} mes${meses===1?'':'es'}`;
}
function addDias(iso, dias){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+dias);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function estadoVacuna(fechaVacuna){
  if(!fechaVacuna) return null;
  const proximaISO = addDias(fechaVacuna, 365);
  const hoy = todayISO();
  const diffDias = Math.round((new Date(proximaISO+'T00:00:00') - new Date(hoy+'T00:00:00'))/(1000*60*60*24));
  let nivel = 'ok';
  if(diffDias<0) nivel='vencida'; else if(diffDias<=30) nivel='pronto';
  return { proximaISO, diffDias, nivel };
}
function resumenHabilidades(p){
  if(!p.habilidades || !p.habilidades.length) return '';
  const logrados = p.habilidades.filter(h=>h.estado==='logrado').length;
  return `${logrados}/${p.habilidades.length} comandos logrados`;
}
function telefonoWhatsApp(tel){
  let limpio = (tel||'').replace(/[^\d]/g,'');
  if(limpio.length===10) limpio = '57'+limpio;
  return limpio;
}
function labelEstadoCliente(e){ return {cotizando:'Cotizando', en_proceso:'En proceso', terminado:'Terminado'}[e]||e; }
function claseCssEstadoCliente(e){ return {cotizando:'cotizando', en_proceso:'enproceso', terminado:'terminado'}[e]||''; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- Cálculo de saldo ---------- */
function saldoCliente(clienteId){
  let deuda = 0, pagado = 0;
  state.clases.forEach(cl=>{
    if(cl.estado==='cancelada') return;
    if(cl.clienteIds.includes(clienteId)) deuda += Number(cl.precio)||0;
  });
  state.pagos.forEach(p=>{ if(p.clienteId===clienteId) pagado += Number(p.monto)||0; });
  return deuda - pagado;
}

/* ---------- Apariencia ---------- */
function applyConfig(){
  document.body.classList.remove('fs-sm','fs-md','fs-lg');
  document.body.classList.add('fs-'+(state.config.fontSize||'md'));
  document.body.classList.toggle('dark', !!state.config.darkMode);
}

/* ---------- Render raíz ---------- */
function render(){
  document.getElementById('todayLabel').textContent = fmtDateLong(todayISO());
  document.querySelectorAll('nav.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });
  const main = document.getElementById('main');
  if(currentTab==='agenda') main.innerHTML = viewAgenda();
  if(currentTab==='clientes') main.innerHTML = viewClientes();
  if(currentTab==='pagos') main.innerHTML = viewPagos();
  if(currentTab==='mas') main.innerHTML = viewMas();
  attachViewHandlers();
  document.getElementById('fab').style.display = (currentTab==='mas') ? 'none':'flex';
}

/* ================= AGENDA: calendario mensual ================= */
function shiftMonth(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  return y+'-'+pad(m);
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
}
function daysInMonthArr(ym){
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startOffset = (first.getDay()+6)%7;
  const numDays = new Date(y, m, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=numDays; d++) cells.push(y+'-'+pad(m)+'-'+pad(d));
  return cells;
}
function weeksInMonth(ym){
  const cells = daysInMonthArr(ym);
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function viewAgenda(){
  const hoy = todayISO();
  const cells = daysInMonthArr(agendaMonth);
  while(cells.length % 7 !== 0) cells.push(null);
  const clasesPorDia = {};
  state.clases.forEach(cl=>{ (clasesPorDia[cl.fecha] = clasesPorDia[cl.fecha]||[]).push(cl); });

  let html = `
  <div class="cal-nav">
    <button data-cal-nav="-1">‹</button>
    <h3>${monthLabel(agendaMonth)}</h3>
    <button data-cal-nav="1">›</button>
  </div>
  <div class="cal-weekday-row">
    ${['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}
  </div>
  <div class="cal-grid">
    ${cells.map(iso=>{
      if(!iso) return `<div class="cal-cell empty"></div>`;
      const dayNum = Number(iso.slice(8,10));
      const has = clasesPorDia[iso] && clasesPorDia[iso].length>0;
      const cls = ['cal-cell'];
      if(iso===hoy) cls.push('today');
      if(iso===agendaSelDay) cls.push('selected');
      return `<div class="${cls.join(' ')}" data-cal-day="${iso}"><span>${dayNum}</span>${has?'<span class="dot"></span>':''}</div>`;
    }).join('')}
  </div>`;

  const claseDelDia = (clasesPorDia[agendaSelDay]||[]).sort((a,b)=>a.horaInicio.localeCompare(b.horaInicio));
  if(claseDelDia.length===0){
    html += `<div class="empty">No hay clases este día.<br>Toca "+" para agendar una.</div>`;
  }else{
    claseDelDia.forEach(cl=>{
      const detalleClientes = cl.clienteIds.map(cid=>{
        const c = state.clientes.find(x=>x.id===cid);
        const perros = c ? perrosResumen(c) : '';
        return `<div>${clienteNombre(cid)}${perros?`<div class="muted" style="font-size:11.5px;margin-top:1px;">🐾 ${perros}</div>`:''}</div>`;
      }).join('') || '(sin clientes)';
      html += `
      <div class="card tap" data-open-clase="${cl.id}">
        <div class="row">
          <strong>${cl.horaInicio}${cl.horaFin? '–'+cl.horaFin:''}</strong>

        </div>

        <div class="row" style="margin-top:6px;">
          <span class="badge ${cl.tipo}">${cl.tipo==='individual'?'Individual':'Grupal'}</span>
          ${cl.precio? `<span class="muted">${fmtMoney(cl.precio)}</span>`:''}
        </div>
      </div>`;
    });
  }
  return html;
}
function labelEstado(e){
  return {programada:'Programada',completada:'Completada',cancelada:'Cancelada',reprogramada:'Reprogramada'}[e] || e;
}

function timeSelectHTML(prefix, value, required){
  const [vh, vm] = (value||'').split(':');
  let hoursOpts = required ? '' : `<option value="" ${!vh?'selected':''}>--</option>`;
  for(let h=0; h<24; h++){
    const hh = pad(h);
    hoursOpts += `<option value="${hh}" ${vh===hh?'selected':''}>${hh}</option>`;
  }
  let minOpts = required ? '' : `<option value="" ${!vm?'selected':''}>--</option>`;
  for(let m=0; m<60; m+=5){
    const mm = pad(m);
    minOpts += `<option value="${mm}" ${vm===mm?'selected':''}>${mm}</option>`;
  }
  return `<div style="display:flex;gap:6px;align-items:center;">
    <select id="${prefix}_h" style="flex:1;">${hoursOpts}</select>
    <span class="muted">:</span>
    <select id="${prefix}_m" style="flex:1;">${minOpts}</select>
  </div>`;
}
function readTimeSelect(prefix){
  const h = document.getElementById(prefix+'_h').value;
  const m = document.getElementById(prefix+'_m').value;
  if(!h || !m) return '';
  return h+':'+m;
}

    if(e.target.classList.contains('chip')){
      document.querySelectorAll('#f_tipo .chip').forEach(c=>c.classList.remove('selected'));
      e.target.classList.add('selected');
      if(e.target.dataset.val==='individual'){
        const seleccionadosChips = [...document.querySelectorAll('#f_clientes .chip.selected')];
        seleccionadosChips.forEach((c,i)=>{ if(i>0) c.classList.remove('selected'); });
      }
    }
  });
  document.getElementById('f_clientes').addEventListener('click', e=>{
    if(!e.target.classList.contains('chip')) return;
    const tipoActual = document.querySelector('#f_tipo .chip.selected')?.dataset.val || 'individual';
    if(tipoActual==='individual'){
      document.querySelectorAll('#f_clientes .chip').forEach(c=>c.classList.remove('selected'));
      e.target.classList.add('selected');
    }else{
      e.target.classList.toggle('selected');
    }
  });
  document.getElementById('f_guardar').addEventListener('click', ()=>{
    const fecha = document.getElementById('f_fecha').value;
    const horaInicio = readTimeSelect('f_inicio');
    if(!fecha || !horaInicio){ toast('Falta la fecha o la hora'); return; }
    const tipo = document.querySelector('#f_tipo .chip.selected')?.dataset.val || 'individual';
    const clienteIds = [...document.querySelectorAll('#f_clientes .chip.selected')].map(c=>c.dataset.val);
    if(clienteIds.length===0){ toast('Selecciona al menos un cliente'); return; }
    if(tipo==='individual' && clienteIds.length>1){ toast('Una clase individual solo puede tener un cliente'); return; }
    const data = {
      fecha, horaInicio,
      horaFin: readTimeSelect('f_fin'),
      tipo, clienteIds,
      precio: Number(document.getElementById('f_precio').value)||0,
      notas: document.getElementById('f_notas').value.trim(),
    };
    if(cl){ Object.assign(cl, data); }
    else{
      const repetir = Math.max(1, Number(document.getElementById('f_repetir')?.value)||1);
      for(let i=0;i<repetir;i++){
        const fechaClase = i===0 ? fecha : addDias(fecha, i*7);

        state.clases.push({ id:uid(), estado:estadoInicial, ...data, fecha:fechaClase });

    document.getElementById('f_borrar').addEventListener('click', ()=>{
      if(confirm('¿Eliminar esta clase? Esta acción no se puede deshacer.')){
        state.clases = state.clases.filter(c=>c.id!==cl.id);
        saveState(); closeModal(); render(); toast('Clase eliminada');

    });

      return texto.includes(q);
    });

  let html = `
  <div class="search-wrap">
    <input type="text" id="buscarCliente" placeholder="Buscar cliente, dueño o perro..." value="${clienteSearch}">
  </div>`;
  if(list.length===0){
    html += `<div class="empty">No hay clientes todavía.<br>Toca "+" para agregar el primero.</div>`;

  list.forEach(c=>{
    const saldo = saldoCliente(c.id);
    const saldoClass = saldo>0?'saldo-pos':(saldo<0?'saldo-neg':'saldo-zero');

/* ---------- Modal genérico ---------- */
let modalHistoryPushed = false;
let awayFromAgenda = false;
function openModal(title, bodyHTML){
  document.getElementById('modalRoot').innerHTML = `
    <div class="overlay" id="overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>${title}</h2><button class="close-x" id="closeModalBtn">✕</button></div>
        ${bodyHTML}
      </div>
    </div>`;
  document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  if(!modalHistoryPushed){
    history.pushState({tab:currentTab, modal:true}, '');
    modalHistoryPushed = true;
  }
}
function closeModalUI(){
  document.getElementById('modalRoot').innerHTML = '';
  modalHistoryPushed = false;
}
function closeModal(){
  if(modalHistoryPushed){ history.back(); }
  else { closeModalUI(); }
}
function goToTab(tab){
  if(tab==='agenda'){
    if(awayFromAgenda){ history.replaceState({tab:'agenda'}, ''); awayFromAgenda=false; }
  }else{
    if(!awayFromAgenda){ history.pushState({tab}, ''); awayFromAgenda=true; }
    else{ history.replaceState({tab}, ''); }
  }
  currentTab = tab;
  render();
}
window.addEventListener('popstate', (e)=>{
  const s = e.state || {tab:'agenda'};
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.innerHTML.trim() !== ''){
    closeModalUI();
  }
  awayFromAgenda = !!(s.tab && s.tab!=='agenda');
  currentTab = s.tab || 'agenda';
  render();
});

/* ---------- Handlers por vista ---------- */
function initSwipeToDelete(){
  const OPEN_X = -84;
  document.querySelectorAll('.swipe-content').forEach(el=>{
    let startX=0, startY=0, currentX=0, dragging=false, open=false, locked=null;
    el.addEventListener('pointerdown', e=>{
      dragging = true; startX = e.clientX; startY = e.clientY; locked=null;
      el.style.transition='none';
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dxRaw = e.clientX - startX;
      const dyRaw = e.clientY - startY;
      if(locked===null && (Math.abs(dxRaw)>6 || Math.abs(dyRaw)>6)){
        locked = Math.abs(dxRaw) > Math.abs(dyRaw) ? 'x' : 'y';
      }
      if(locked==='y'){ return; }
      if(locked==='x'){
        let dx = dxRaw + (open?OPEN_X:0);
        dx = Math.min(0, Math.max(OPEN_X, dx));
        currentX = dx;
        el.style.transform = `translateX(${dx}px)`;
      }
    });
    function endDrag(){
      if(!dragging) return;
      dragging=false;
      el.style.transition='transform .18s ease';
      if(locked==='x'){
        if(currentX < OPEN_X/2){ el.style.transform = `translateX(${OPEN_X}px)`; open=true; }
        else { el.style.transform = 'translateX(0)'; open=false; }
      }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  });
  document.querySelectorAll('[data-swipe-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.swipeDel;
      if(confirm('¿Eliminar este pago del historial?')){
        state.pagos = state.pagos.filter(p=>p.id!==id);
        saveState(); render(); toast('Pago eliminado');
      }
    });
  });
}

  const statsIni = document.getElementById('stats_rango_ini');
  const statsFin = document.getElementById('stats_rango_fin');
  if(statsIni) statsIni.addEventListener('change', ()=>{ statsRangeStart = statsIni.value; render(); });
  if(statsFin) statsFin.addEventListener('change', ()=>{ statsRangeEnd = statsFin.value; render();
  });
  document.querySelectorAll('[data-raza-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(confirm('¿Quitar "'+el.dataset.razaDel+'" de la lista de razas?')){
        state.config.razas = state.config.razas.filter(r=>r!==el.dataset.razaDel);
        saveState(); render();
      }
    });
  });
  const razaAdd = document.getElementById('raza_add');
  if(razaAdd) razaAdd.addEventListener('click', ()=>{
    const input = document.getElementById('raza_nueva');
    const val = input.value.trim();
    if(!val){ toast('Escribe el nombre de la raza'); return; }
    if(state.config.razas.includes(val)){ toast('Esa raza ya está en la lista'); return; }
    state.config.razas.push(val);
    saveState(); render(); toast('Raza agregada');
  });
  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.addEventListener('click', ()=>{ agendaSelDay = el.dataset.calDay; render(); });
  });
  const buscar = document.getElementById('buscarCliente');
  if(buscar){
    buscar.addEventListener('input', ()=>{
      clienteSearch = buscar.value; render();
      setTimeout(()=>{ const b=document.getElementById('buscarCliente'); if(b){ b.focus(); b.selectionStart=b.selectionEnd=b.value.length; } },0);
    });
  }
  document.querySelectorAll('[data-rec-toggle]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const r = state.recordatorios.find(x=>x.id===el.dataset.recToggle);
      r.completado = el.checked; saveState(); render();
    });
  });
  document.querySelectorAll('[data-rec-del]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.recordatorios = state.recordatorios.filter(x=>x.id!==el.dataset.recDel);
      saveState(); render();
    });
  });
  const addRec = document.getElementById('m_addRec');
  if(addRec) addRec.addEventListener('click', modalNuevoRecordatorio);

  const cfgFs = document.getElementById('cfg_fontsize');
  if(cfgFs) cfgFs.addEventListener('click', e=>{
    if(e.target.classList.contains('chip')){
      state.config.fontSize = e.target.dataset.val; saveState(); applyConfig(); render();
    }
  });
  const cfgTheme = document.getElementById('cfg_theme');
  if(cfgTheme) cfgTheme.addEventListener('click', e=>{
    if(e.target.classList.contains('chip')){
      state.config.darkMode = e.target.dataset.val==='dark'; saveState(); applyConfig(); render();
    }
  });

  const exp = document.getElementById('m_export');
  if(exp) exp.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `adiestra-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Copia exportada');
  });
  const imp = document.getElementById('m_import');
  const impFile = document.getElementById('m_importFile');
  if(imp) imp.addEventListener('click', ()=> impFile.click());
  if(impFile) impFile.addEventListener('change', ()=>{
    const file = impFile.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm('Esto reemplazará todos los datos actuales por los del archivo. ¿Continuar?')) return;
        state = {
          clientes: data.clientes||[], clases: data.clases||[],
          pagos: data.pagos||[], notas: data.notas||[], recordatorios: data.recordatorios||[],
          config: data.config || {fontSize:'md',darkMode:false}
        };
        migrarDatos();
        saveState(); applyConfig(); render(); toast('Datos importados');
      }catch(e){ toast('Archivo inválido'); }
    };
    reader.readAsText(file);
  });

  const checkUpdate = document.getElementById('m_checkUpdate');
  if(checkUpdate) checkUpdate.addEventListener('click', async ()=>{
    toast('Buscando actualización...');
    try{
      if('caches' in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      if('serviceWorker' in navigator){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      setTimeout(()=>{
        const base = window.location.origin + window.location.pathname;
        window.location.href = base + '?_=' + Date.now();
      }, 400);
    }catch(e){
      toast('No se pudo actualizar. Verifica tu conexión a internet.');
    }
  });
  initSwipeToDelete();
}

/* ---------- Navegación y FAB ---------- */
document.querySelectorAll('nav.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=>{ goToTab(b.dataset.tab); });
});
document.getElementById('fab').addEventListener('click', ()=>{
  if(currentTab==='agenda') modalNuevaClase(null, agendaSelDay);
  if(currentTab==='clientes') modalNuevoCliente(null);
  if(currentTab==='pagos') modalNuevoPago(null, null);
});

history.replaceState({tab:'agenda'}, '');
migrarDatos();
applyConfig();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
